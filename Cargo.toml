[workspace]
members = ["crates/moff-core", "crates/moff-cli", "crates/moff-outlook-owa"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/thrashr888/moff"
description = "Agent-first Microsoft 365 CLI scaffolding"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[profile.release]
strip = "symbols"
