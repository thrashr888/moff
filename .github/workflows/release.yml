name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Build native binary
        run: cargo build --release --target ${{ matrix.target }} -p moff-cli
      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../moff-${{ matrix.target }}.tar.gz moff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moff-${{ matrix.target }}
          path: moff-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true
      - name: Create draft release and upload binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            moff-aarch64-apple-darwin.tar.gz
            moff-x86_64-apple-darwin.tar.gz
          draft: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true
      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum moff-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum moff-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        uses: thrashr888/homebrew-tap@200f49e437cd6cb5477f10aa0570082e889dc7c6 # main
        with:
          formula: moff
          tag: ${{ github.ref_name }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          darwin-arm64-sha256: ${{ steps.sha.outputs.darwin_arm64 }}
          darwin-amd64-sha256: ${{ steps.sha.outputs.darwin_amd64 }}
          template: |
            class Moff < Formula
              desc "Agent-first Microsoft 365 CLI"
              homepage "https://github.com/thrashr888/moff"
              version "${VERSION}"
              license "MIT"

              on_macos do
                if Hardware::CPU.arm?
                  url "https://github.com/thrashr888/moff/releases/download/${TAG}/moff-aarch64-apple-darwin.tar.gz"
                  sha256 "${SHA_DARWIN_ARM64}"
                else
                  url "https://github.com/thrashr888/moff/releases/download/${TAG}/moff-x86_64-apple-darwin.tar.gz"
                  sha256 "${SHA_DARWIN_AMD64}"
                end
              end

              def install
                bin.install "moff"
              end

              test do
                assert_match "moff", shell_output("#{bin}/moff --help")
              end
            end
