[package]
name = "moff-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Outlook Web browser-session CLI"

[[bin]]
name = "moff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
moff-core = { path = "../moff-core", version = "0.4.0" }
moff-outlook-owa = { path = "../moff-outlook-owa", version = "0.4.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints]
workspace = true
