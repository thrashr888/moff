[package]
name = "moff-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Moff agent-first command line interface"

[[bin]]
name = "moff"
path = "src/main.rs"

[[bin]]
name = "moff-test"
path = "src/bin/moff-test.rs"
required-features = ["test-support"]

[features]
test-support = ["moff-core/test-support"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
moff-core = { path = "../moff-core", version = "0.1.0" }
moff-outlook-local = { path = "../moff-outlook-local", version = "0.1.0" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["parsing"] }
uuid = "1.22.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints]
workspace = true
