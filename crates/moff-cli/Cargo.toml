[package]
name = "moff-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local macOS Outlook screen reader CLI"

[[bin]]
name = "moff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
moff-core = { path = "../moff-core", version = "0.1.0" }
moff-outlook-local = { path = "../moff-outlook-local", version = "0.1.0" }
serde_json = "1.0.145"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints]
workspace = true
