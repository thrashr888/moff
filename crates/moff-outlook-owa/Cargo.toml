[package]
name = "moff-outlook-owa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Outlook Web browser-session adapter"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
url = "2.5.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cider = { package = "cider-cli", git = "https://github.com/thrashr888/cider", rev = "5f49de686c1965db44ec4398a4589acbe33e35e2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
