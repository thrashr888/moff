[package]
name = "moff-outlook-owa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Outlook Web browser-session adapter"

[dependencies]
base64 = "0.23"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cider = { package = "cider-cli", git = "https://github.com/thrashr888/cider", rev = "7220e5d6ef2dfbcfa35243f2b054666c4782f8f1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
