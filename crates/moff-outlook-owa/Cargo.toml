[package]
name = "moff-outlook-owa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Outlook Web browser-session adapter"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cider = { package = "cider-cli", git = "https://github.com/thrashr888/cider", rev = "0b6c27de438aa2baf80394b1542b8850786801f8", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
